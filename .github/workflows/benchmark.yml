name: Run benchmark between base branch

on:
  pull_request:
    branches:
      - "main"

jobs:
  benchmark-base:
    if: startsWith(github.head_ref, 'perf/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.5
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Run benchmark for base branch
        run: make benchmark > bench.base.txt
      - name: Upload base benchmark result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-base
          path: bench.base.txt
  benchmark-head:
    if: startsWith(github.head_ref, 'perf/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.5
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run benchmark for head branch
        run: make benchmark > bench.head.txt
      - name: Upload base benchmark result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-head
          path: bench.head.txt
  compare:
    if: startsWith(github.head_ref, 'perf/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    needs: [ benchmark-base, benchmark-head ]
    steps:
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.5
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download base benchmark result
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: benchmark-base
      - name: Download head benchmark result
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: benchmark-head
      - name: Compare benchmarks and put comment
        run: |
          go run cmd/benchmark/main.go ./bench.base.txt ./bench.head.txt > comment.md
          gh pr comment ${{ github.event.number }} --body-file ./comment.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
